<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو الرسم</title>
<style>
:root{--bg:#f3f3f9;--panel:#fff;--ink:#17172b;--mute:#6b6b85;--line:#e0e0ec;--acc:#6d4aff;--acc2:#ff4fa3;--stage:#d6d6e4;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e19;--panel:#1a1a2b;--ink:#f1f1fa;--mute:#9a9ab8;--line:#2d2d45;--stage:#20202e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e19;--panel:#1a1a2b;--ink:#f1f1fa;--mute:#9a9ab8;--line:#2d2d45;--stage:#20202e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.3 "Segoe UI",Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.logo{font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:16px;white-space:nowrap;margin-inline-end:4px}
.b{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center;flex:none}
.b:hover{border-color:var(--acc)}.b:disabled{opacity:.35;cursor:default}
.b.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0}
.sp{flex:1;min-width:4px}
#zl{min-width:44px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
@media(max-width:640px){.b .t{display:none}.b{padding:8px 11px;font-size:16px}}
main{position:relative;flex:1;min-height:0}
